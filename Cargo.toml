[package]
name = "x2x-rust"
version = "0.1.0"
edition = "2021"
authors = ["x2x-rust contributors"]
license = "MIT OR BSD-2-Clause"
description = "Control X displays with shared keyboard/mouse"
repository = "https://github.com/sah4ez/x2x"
readme = "README.md"
keywords = ["x11", "xorg", "remote", "input", "clipboard"]
categories = ["command-line-utilities", "os::unix-apis"]

[features]
default = ["x11"]
x11 = []
win32 = ["x11", "dep:windows"]

[dependencies]
# X11 dependencies
x11-dl = "2.21"
x11-clipboard = "0.7"
# XTest is part of xlib, use x11-dl for direct calls

# System utilities
nix = "0.27"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Logging
log = "0.4"
env_logger = "0.10"

# Async support (optional, for future use)
# tokio = { version = "1.35", features = ["full"], optional = true }

# Windows support (optional)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.51", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
], optional = true }

[dev-dependencies]
# Testing
proptest = "1.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

[profile.bench]
inherits = "release"
